# Chạy thử cả hệ thống: docker compose up --build  -> http://localhost:3000
services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: expense, POSTGRES_PASSWORD: expense, POSTGRES_DB: expense }
  backend:
    build: ./backend
    environment: { DB_HOST: db }
    ports: ["8080:8080"]      # để test API trực tiếp / chạy npm run dev ở frontend
    depends_on: [db]
  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [backend]
