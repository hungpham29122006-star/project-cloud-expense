# CSDL: 1 replica, gắn cố định vào worker1 (hostPath) để dữ liệu không mất khi Pod restart.
apiVersion: v1
kind: Secret
metadata: { name: db-secret, namespace: expense }
type: Opaque
stringData:
  POSTGRES_USER: expense
  POSTGRES_PASSWORD: ChangeMe123
  POSTGRES_DB: expense
---
apiVersion: v1
kind: PersistentVolume
metadata: { name: expense-pv }
spec:
  capacity: { storage: 2Gi }
  accessModes: [ReadWriteOnce]
  storageClassName: manual
  persistentVolumeReclaimPolicy: Retain
  hostPath: { path: /data/expense-pg, type: DirectoryOrCreate }
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - { key: kubernetes.io/hostname, operator: In, values: [worker1] }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: expense-pvc, namespace: expense }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: manual
  resources: { requests: { storage: 2Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, namespace: expense }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      nodeSelector: { kubernetes.io/hostname: worker1 }
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom: [{ secretRef: { name: db-secret } }]
          env: [{ name: PGDATA, value: /var/lib/postgresql/data/pgdata }]
          ports: [{ containerPort: 5432 }]
          readinessProbe: { exec: { command: ["pg_isready", "-U", "expense"] }, periodSeconds: 5 }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: expense-pvc }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: expense }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
